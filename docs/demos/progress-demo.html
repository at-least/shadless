<!doctype html>
<html><head><meta charset="utf-8"><title>shadless progress-demo</title>
<link rel="stylesheet" href="../out.css"><script>(function(){try{var k="shadless-docs-theme";var apply=function(d){document.documentElement.classList.toggle("dark",!!d)};var s=localStorage.getItem(k);var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;apply(d);addEventListener("storage",function(e){if(e.key===k)apply(e.newValue==="dark")});}catch(e){}})();</script></head>
<body class="p-8">
<div aria-valuemax="100" aria-valuemin="0" role="progressbar" data-state="indeterminate" data-max="100" data-slot="progress" class="bg-muted h-1 rounded-full relative flex items-center overflow-x-hidden w-[60%]"><div data-state="indeterminate" data-max="100" data-slot="progress-indicator" class="bg-primary size-full flex-1 transition-all" style="transform: translateX(-87%);"></div></div>
</body></html>
