<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>message-scroller-previous-context</title>
<link rel="stylesheet" href="../out.css"><script>(function(){try{var k="shadless-docs-theme";var apply=function(d){document.documentElement.classList.toggle("dark",!!d)};var s=localStorage.getItem(k);var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;apply(d);addEventListener("storage",function(e){if(e.key===k)apply(e.newValue==="dark")});}catch(e){}})();</script><link rel="stylesheet" href="../fonts.css"></head>
<body class="p-8">
  <div class="mx-auto flex flex-col gap-4 w-full max-w-sm">
    <div data-slot="card" class="w-full" style="height:35rem;gap:0">
      <div data-slot="card-header" class="border-b" style="gap:calc(var(--spacing)*1)">
        <div data-slot="card-title">Keeping Context Visible</div>
        <div data-slot="card-description">New turns keep part of the previous reply in view.</div>
        <div data-slot="card-action">
          <button data-slot="button" type="button" data-variant="outline" data-size="icon" id="t1-trigger" aria-label="Reset context example" data-state="closed" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
          </button>
        </div>
      </div>
      <div data-slot="card-content" class="flex-1 min-h-0" style="overflow:hidden;padding:0">
        <div data-slot="message-scroller" class="group/message-scroller" id="scroller">
          <div data-slot="message-scroller-viewport" id="ms-viewport" role="region" aria-label="Messages" tabindex="0">
            <div data-slot="message-scroller-content" id="ms-content" role="log" aria-relevant="additions" style="padding:var(--card-spacing)"></div>
          </div>
          <button data-slot="message-scroller-button" id="ms-button" type="button" data-active="false" aria-label="Scroll to latest" style="bottom:calc(var(--spacing)*2)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            <span class="sr-only">Scroll to latest</span>
          </button>
        </div>
      </div>
      <div data-slot="card-footer" style="flex-direction:column;gap:calc(var(--spacing)*2)">
        <form id="composer" style="width:100%">
          <div data-slot="input-group" class="group/input-group" style="height:auto;flex-direction:column;align-items:stretch">
            <div style="height:3.5rem;width:100%;padding:0.625rem 0.75rem">
              <span id="next-msg" class="line-clamp-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden"></span>
            </div>
            <div data-slot="input-group-addon" role="group" data-align="block-end" style="padding-top:0.25rem;justify-content:flex-start;width:100%;gap:calc(var(--spacing)*2)">
              <button data-slot="button" type="button" data-variant="outline" data-size="icon-sm" id="d1-trigger" aria-label="Add files" aria-haspopup="menu" aria-expanded="false" data-state="closed" data-radixuigo-menu-trigger="d1">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
              </button>
              <div style="display:flex;width:7rem;align-items:center;gap:calc(var(--spacing)*2)">
                <span class="text-xs tabular-nums" id="peek-px" style="color:var(--muted-foreground)">64px</span>
                <span data-slot="slider" id="s1" data-orientation="horizontal" dir="ltr" class="w-full">
                  <span data-slot="slider-track" data-orientation="horizontal">
                    <span data-slot="slider-range" data-orientation="horizontal" style="left:0%;right:100%"></span>
                  </span>
                  <span style="position:absolute;transform:var(--radix-slider-thumb-transform);left:0%">
                    <span data-slot="slider-thumb" role="slider" tabindex="0" aria-label="Previous context peek" aria-valuemin="64" aria-valuemax="128" aria-valuenow="64" aria-orientation="horizontal"></span>
                  </span>
                </span>
              </div>
              <button data-slot="button" type="submit" data-variant="default" data-size="icon-sm" id="send-btn" style="margin-inline-start:auto" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>
                <span class="sr-only">Send</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <p class="text-center text-xs" style="color:var(--muted-foreground);padding-inline:calc(var(--spacing)*0.5)">Adjust the slider and send. Observe the previous message peek.</p>
  </div>
  <template id="t1-portal">
    <div data-slot="tooltip-content" id="tt1" role="tooltip" data-state="closed">Reset
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
    </div>
  </template>
  <template id="d1-tpl">
    <div data-slot="dropdown-menu-content" id="d1" role="menu" tabindex="-1" data-state="closed" dir="ltr" aria-orientation="vertical" data-orientation="vertical" aria-labelledby="d1-trigger" style="width:11rem">
      <div data-slot="dropdown-menu-item" role="menuitem" tabindex="-1" data-variant="default" data-orientation="vertical"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"></path></svg>Add Photos &amp; Files</div>
      <div data-slot="dropdown-menu-separator" role="separator" aria-orientation="horizontal"></div>
      <div data-slot="dropdown-menu-item" role="menuitem" tabindex="-1" data-variant="default" data-orientation="vertical"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>Create Image</div>
      <div data-slot="dropdown-menu-item" role="menuitem" tabindex="-1" data-variant="default" data-orientation="vertical"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.065 12.493-6.18 1.318a.934.934 0 0 1-1.108-.702l-.537-2.15a1.07 1.07 0 0 1 .691-1.265l13.504-4.44"></path><path d="m13.56 11.747 4.332-.924"></path><path d="m16 21-3.105-6.21"></path><path d="M16.485 5.94a2 2 0 0 1 1.455-2.425l1.09-.272a1 1 0 0 1 1.212.727l1.515 6.06a1 1 0 0 1-.727 1.213l-1.09.272a2 2 0 0 1-2.425-1.455z"></path><path d="m6.158 8.633 1.114 4.456"></path><path d="m8 21 3.105-6.21"></path></svg>Deep Research</div>
      <div data-slot="dropdown-menu-item" role="menuitem" tabindex="-1" data-variant="default" data-orientation="vertical"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>Web Search</div>
    </div>
  </template>
  <script src="../shadless.js"></script>
  <script src="../js/dropdown-menu.js"></script>
  <script src="../js/tooltip.js"></script>
  <script>
    (function () {
      var script = [
        { u: "I'm building a chat for our app and the scroll behavior is driving me nuts. Every time the AI streams a reply, the whole thread jumps around.", a: "That's the classic streaming scroll problem. Wrap your message list in MessageScroller and turn on autoScroll — the viewport pins to the bottom as tokens arrive, so users always see the latest text land in place.\n\nThe important part: it only auto-scrolls while the reader is already at the bottom. The moment they scroll up to read something earlier, auto-scroll backs off and their position is preserved. You get smooth streaming without fighting the user's intent." },
        { u: "Okay, but when someone sends a new message the view still feels jarring — like the whole conversation reloads from the top.", a: "MessageScrollerItem fixes that with turn anchoring. Set scrollAnchor on the turn that should settle near the top instead of blindly snapping to the document bottom.\n\nIt also leaves a small peek of the previous exchange visible above the anchor, so context isn't lost. The reply starts in view without that disorienting jump you get from a plain overflow container." },
        { u: "And if they've scrolled up to re-read an older answer? I don't want to yank them back down.", a: "You won't. Auto-scroll only runs when the viewport is already pinned to the bottom, so scrolling up is a deliberate opt-out — their place in the thread stays put even as new tokens keep arriving below.\n\nWhen there is content they haven't seen yet, MessageScrollerButton appears at the bottom of the viewport. One tap jumps them back to the newest message and re-engages auto-scroll. Same pattern as Slack or iMessage: quiet when you're caught up, helpful when you're not." },
        { u: "Last one — does this work with assistive tech?", a: "MessageScrollerContent sets role=\"log\" and aria-relevant=\"additions\" by default, so screen readers announce new messages as they stream in.\n\nThe scroll button is a real button with an sr-only label, and it's removed from the tab order when you're already at the bottom — no ghost focus stops." },
      ]
      var DEFAULT_PEEK = 64
      var peek = DEFAULT_PEEK
      var nextIdx = 2
      var busy = false
      var viewport = document.getElementById("ms-viewport")
      var content = document.getElementById("ms-content")
      var button = document.getElementById("ms-button")
      var sendBtn = document.getElementById("send-btn")
      var resetBtn = document.getElementById("t1-trigger")
      var nextMsg = document.getElementById("next-msg")
      var peekPx = document.getElementById("peek-px")
      var form = document.getElementById("composer")
      var scroller = document.getElementById("scroller")
      var card = document.querySelector("[data-slot=card]")
      card.style.setProperty("--card-spacing", "calc(var(--spacing) * 6)")

      function paras(t) { return t.split(/\n\s*\n/).map(function (p) { return p.trim() }).filter(Boolean) }
      function userRow(text, n) {
        var id = "prev-u-" + n
        return '<div data-slot="message-scroller-item" data-message-id="' + id + '" data-scroll-anchor="">' +
          '<div data-slot="message" class="group/message" data-align="end"><div data-slot="message-content">' +
          '<div data-slot="bubble" class="group/bubble" data-variant="muted" data-align="end"><div data-slot="bubble-content">' + text + "</div></div>" +
          "</div></div></div>"
      }
      function assistantRow(text, n) {
        var id = "prev-a-" + n
        return '<div data-slot="message-scroller-item" data-message-id="' + id + '">' +
          '<div data-slot="message" class="group/message"><div data-slot="message-content">' +
          '<div data-slot="bubble" class="group/bubble" data-variant="ghost"><div data-slot="bubble-content">' +
          paras(text).map(function (p) { return '<p style="white-space:pre-wrap">' + p + "</p>" }).join("") + "</div></div>" +
          "</div></div></div>"
      }
      function assistantShell(id) {
        return '<div data-slot="message-scroller-item" data-message-id="' + id + '">' +
          '<div data-slot="message" class="group/message"><div data-slot="message-content">' +
          '<div data-slot="bubble" class="group/bubble" data-variant="ghost"><div data-slot="bubble-content" id="' + id + '-c"></div></div>' +
          "</div></div></div>"
      }
      function renderInitial() {
        content.innerHTML = userRow(script[0].u, 1) + assistantRow(script[1].a, 1)
      }
      renderInitial()

      function update() {
        var end = viewport.scrollTop + viewport.clientHeight < viewport.scrollHeight - 1
        button.setAttribute("data-active", end ? "true" : "false")
      }
      viewport.addEventListener("scroll", update)
      button.addEventListener("click", function () { viewport.scrollTo({ top: viewport.scrollHeight, behavior: "smooth" }) })

      function syncUI() {
        var next = nextIdx < script.length
        sendBtn.disabled = !next || busy
        if (sendBtn.disabled) sendBtn.setAttribute("data-disabled", "true"); else sendBtn.removeAttribute("data-disabled")
        resetBtn.disabled = busy
        if (resetBtn.disabled) resetBtn.setAttribute("data-disabled", "true"); else resetBtn.removeAttribute("data-disabled")
        content.setAttribute("aria-busy", String(busy))
        nextMsg.style.opacity = busy ? "0.6" : "1"
        if (next) nextMsg.textContent = script[nextIdx].u
        else nextMsg.innerHTML = '<span style="color:var(--muted-foreground)">No messages queued. Reset the context.</span>'
      }

      function send() {
        if (nextIdx >= script.length || busy) return
        var uText = script[nextIdx].u
        var aText = script[nextIdx + 1].a
        var uN = (nextIdx / 2) + 1
        var tmp = document.createElement("div")
        tmp.innerHTML = userRow(uText, uN)
        var uItem = tmp.firstElementChild
        content.appendChild(uItem)
        viewport.scrollTop = Math.max(0, uItem.offsetTop - peek)
        nextIdx += 2
        busy = true
        syncUI()
        var aId = "prev-a-" + uN
        tmp.innerHTML = assistantShell(aId)
        content.appendChild(tmp.firstElementChild)
        var sink = document.getElementById(aId + "-c")
        var parts = paras(aText)
        var pi = 0, ti = 0
        var full = parts[0] || ""
        sink.innerHTML = '<p style="white-space:pre-wrap"></p>'
        var pEl = sink.firstElementChild
        var timer = setInterval(function () {
          if (ti < full.length) { pEl.textContent = full.slice(0, ti + 3); ti += 3 }
          else {
            pi++
            if (pi < parts.length) {
              sink.insertAdjacentHTML("beforeend", '<p style="white-space:pre-wrap"></p>')
              pEl = sink.lastElementChild; full = parts[pi]; ti = 0
            } else { clearInterval(timer); busy = false; syncUI() }
          }
          update()
        }, 35)
      }
      form.addEventListener("submit", function (e) { e.preventDefault(); send() })
      resetBtn.addEventListener("click", function () {
        if (busy) return
        nextIdx = 2; peek = DEFAULT_PEEK
        peekPx.textContent = DEFAULT_PEEK + "px"
        renderInitial()
        viewport.scrollTop = 0
        syncUI(); update()
      })

      var sliderRoot = document.querySelector("[data-slot=slider]")
      RadixKernel.wireSlider({
        root: sliderRoot,
        track: sliderRoot.querySelector("[data-slot=slider-track]"),
        range: sliderRoot.querySelector("[data-slot=slider-range]"),
        defaultValue: [DEFAULT_PEEK],
        min: 64, max: 128, step: 1,
        onValueChange: function (v) { peek = v[0] || DEFAULT_PEEK; peekPx.textContent = peek + "px" },
      })

      requestAnimationFrame(function () { viewport.scrollTop = 0; update() })
      syncUI()
    })()
  </script>
</body></html>
