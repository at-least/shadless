<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>message-scroller-anchoring</title>
<link rel="stylesheet" href="../out.css"><script>(function(){try{var k="shadless-docs-theme";var apply=function(d){document.documentElement.classList.toggle("dark",!!d)};var s=localStorage.getItem(k);var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;apply(d);addEventListener("storage",function(e){if(e.key===k)apply(e.newValue==="dark")});}catch(e){}})();</script><link rel="stylesheet" href="../fonts.css"></head>
<body class="p-8">
  <div class="mx-auto flex flex-col gap-4 w-full max-w-sm">
    <div data-slot="card" class="w-full" style="height:35rem;gap:0">
      <div data-slot="card-header" class="border-b">
        <div data-slot="card-title">Anchoring Turns</div>
        <div data-slot="card-description">Choose which role settles near the top edge.</div>
        <div data-slot="card-action">
          <button data-slot="button" type="button" data-variant="outline" data-size="icon" id="reset-btn" aria-label="Reset anchored turns" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
          </button>
        </div>
      </div>
      <div data-slot="card-content" class="flex-1 min-h-0" style="overflow:hidden;padding:0">
        <div data-slot="empty" id="empty-state" class="h-full">
          <div data-slot="empty-header">
            <div data-slot="empty-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.1 2.182a10 10 0 0 1 3.8 0"></path><path d="M13.9 21.818a10 10 0 0 1-3.8 0"></path><path d="M17.609 3.72a10 10 0 0 1 2.69 2.7"></path><path d="M2.182 13.9a10 10 0 0 1 0-3.8"></path><path d="M20.28 17.61a10 10 0 0 1-2.7 2.69"></path><path d="M21.818 10.1a10 10 0 0 1 0 3.8"></path><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"></path><path d="m6.163 21.117-2.906.85a1 1 0 0 1-1.236-1.169l.965-2.98"></path></svg>
            </div>
            <div data-slot="empty-title">No anchored messages yet</div>
            <div data-slot="empty-description">Send the first message to see the selected role anchor.</div>
          </div>
        </div>
        <div data-slot="message-scroller" class="group/message-scroller" id="scroller" hidden>
          <div data-slot="message-scroller-viewport" id="ms-viewport" role="region" aria-label="Messages" tabindex="0">
            <div data-slot="message-scroller-content" id="ms-content" role="log" aria-relevant="additions" style="padding:var(--card-spacing)">
            </div>
          </div>
          <button data-slot="message-scroller-button" id="ms-button" type="button" data-active="false" aria-label="Scroll to latest" style="bottom:calc(var(--spacing)*2)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            <span class="sr-only">Scroll to latest</span>
          </button>
        </div>
      </div>
      <div data-slot="card-footer">
        <div data-slot="toggle-group" id="tg1" dir="ltr" role="radiogroup" aria-label="Select scroll anchor role" data-spacing="2" style="--gap:2" tabindex="0">
          <button data-slot="toggle-group-item" type="button" value="user" aria-label="Anchor user messages" data-state="on" role="radio" aria-checked="true" data-spacing="2" tabindex="0">User</button>
          <button data-slot="toggle-group-item" type="button" value="assistant" aria-label="Anchor assistant messages" data-state="off" role="radio" aria-checked="false" data-spacing="2" tabindex="-1">Assistant</button>
        </div>
        <button data-slot="button" type="button" data-size="icon" id="send-btn" style="margin-inline-start:auto">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>
          <span class="sr-only">Send Message</span>
        </button>
      </div>
    </div>
    <p class="text-center text-xs" style="color:var(--muted-foreground);padding-inline:calc(var(--spacing)*0.5)">Toggle the anchor role, then send messages to compare where turns settle.</p>
  </div>
  <script src="../shadless.js"></script>
  <script>
    (function () {
      var scripted = [
        { id: "anchor-1-user", role: "user", text: "Can you show me how anchoring behaves when a new prompt starts the turn?" },
        { id: "anchor-1-assistant", role: "assistant", text: "Append the user prompt first, then append the assistant response. With User selected, the prompt settles near the top and the assistant response fills in below it." },
        { id: "anchor-2-user", role: "user", text: "What changes when assistant messages are the anchor?" },
        { id: "anchor-2-assistant", role: "assistant", text: "Now each assistant response is the item MessageScroller keeps in view. This is useful when the reply is the moment you want readers to land on after each turn." },
        { id: "anchor-3-user", role: "user", text: "Can I switch roles and keep adding turns?" },
        { id: "anchor-3-assistant", role: "assistant", text: "Yes. The next appended message with the selected role becomes the anchor, so you can compare user and assistant anchoring without resetting the demo." },
      ]
      var anchorRole = "user"
      var messages = []
      var index = 0
      var PEEK = 32
      var viewport = document.getElementById("ms-viewport")
      var content = document.getElementById("ms-content")
      var button = document.getElementById("ms-button")
      var sendBtn = document.getElementById("send-btn")
      var resetBtn = document.getElementById("reset-btn")
      var emptyState = document.getElementById("empty-state")
      var scroller = document.getElementById("scroller")
      var card = document.querySelector("[data-slot=card]")
      card.style.setProperty("--card-spacing", "calc(var(--spacing) * 6)")

      function paras(t) { return t.split(/\n\s*\n/).map(function (p) { return p.trim() }).filter(Boolean) }
      function rowHTML(m) {
        var isUser = m.role === "user"
        var isAnchor = m.role === anchorRole
        var body = '<div data-slot="bubble-content">' + (isUser ? m.text : paras(m.text).map(function (p) { return '<p style="white-space:pre-wrap">' + p + "</p>" }).join("")) + "</div>"
        return '<div data-slot="message-scroller-item" data-message-id="' + m.id + '"' + (isAnchor ? ' data-scroll-anchor=""' : "") + ">" +
          '<div data-slot="message" class="group/message"' + (isUser ? ' data-align="end"' : "") + ">" +
          '<div data-slot="message-content">' +
          '<div data-slot="bubble" class="group/bubble" data-variant="' + (isUser ? "muted" : "ghost") + '"' + (isUser ? ' data-align="end"' : "") + ">" + body + "</div>" +
          "</div></div></div>"
      }
      function syncSend() {
        sendBtn.disabled = index >= scripted.length
        if (sendBtn.disabled) sendBtn.setAttribute("data-disabled", "true"); else sendBtn.removeAttribute("data-disabled")
        resetBtn.disabled = messages.length === 0
        if (resetBtn.disabled) resetBtn.setAttribute("data-disabled", "true"); else resetBtn.removeAttribute("data-disabled")
      }
      function update() {
        var end = viewport.scrollTop + viewport.clientHeight < viewport.scrollHeight - 1
        button.setAttribute("data-active", end ? "true" : "false")
      }
      viewport.addEventListener("scroll", update)
      button.addEventListener("click", function () { viewport.scrollTo({ top: viewport.scrollHeight, behavior: "smooth" }) })

      function appendNext() {
        if (index >= scripted.length) return
        var m = scripted[index]
        messages.push(m)
        index++
        emptyState.hidden = true
        scroller.hidden = false
        var wasEmpty = messages.length === 1
        content.insertAdjacentHTML("beforeend", rowHTML(m))
        var newItem = content.lastElementChild
        if (m.role === anchorRole) {
          var prev = newItem.previousElementSibling
          var peek = prev ? PEEK : 0
          viewport.scrollTop = Math.max(0, newItem.offsetTop - peek)
        } else if (wasEmpty) {
          viewport.scrollTop = 0
        }
        update()
        syncSend()
      }
      sendBtn.addEventListener("click", appendNext)

      function reset() {
        messages = []
        index = 0
        content.innerHTML = ""
        scroller.hidden = true
        emptyState.hidden = false
        syncSend()
      }
      resetBtn.addEventListener("click", reset)

      // toggle-group selection (shadless.js manages visual state; react here)
      var items = document.querySelectorAll("[data-slot=toggle-group-item]")
      items.forEach(function (it) {
        it.addEventListener("click", function () {
          var v = it.getAttribute("value")
          if (v !== "user" && v !== "assistant") return
          if (v === anchorRole) return
          anchorRole = v
          reset()
        })
      })

      syncSend()
      shadless.initAll()
    })()
  </script>
</body></html>
