<!doctype html>
<html><head><meta charset="utf-8"><title>shadless card</title>
<link rel="stylesheet" href="../out.css"><script>(function(){try{var k="shadless-docs-theme";var apply=function(d){document.documentElement.classList.toggle("dark",!!d)};var s=localStorage.getItem(k);var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;apply(d);addEventListener("storage",function(e){if(e.key===k)apply(e.newValue==="dark")});}catch(e){}})();</script><link rel="stylesheet" href="../fonts.css"></head>
<body>
<div data-slot="card" class="group/card"><div data-slot="card-header"><div data-slot="card-title" style="font-weight:600">Create project</div><div data-slot="card-description" style="font-size:0.875rem;color:hsl(var(--muted-foreground))">Deploy your new project in one-click.</div></div><div data-slot="card-content" style="margin-top:1rem"><p>Set up your project with our intuitive wizard.</p></div><div data-slot="card-footer" style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem"><button>Cancel</button><button style="background:hsl(var(--primary));color:hsl(var(--primary-foreground));padding:0.375rem 0.75rem;border-radius:0.375rem">Deploy</button></div></div>
<div data-slot="card-header" class="group/card-header"><div data-slot="card-title" style="font-weight:600">Title</div><div data-slot="card-description" style="font-size:0.875rem;color:hsl(var(--muted-foreground))">Description</div></div>
<div data-slot="card-title" class="cn-font-heading">Title</div>
<div data-slot="card-description">Description</div>
<div data-slot="card-action"></div>
<div data-slot="card-content">Content</div>
<div data-slot="card-footer">Footer</div>
</body></html>
