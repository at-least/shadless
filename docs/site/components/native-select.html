<!doctype html>
<html><head><meta charset="utf-8"><title>shadless native-select</title>
<link rel="stylesheet" href="../out.css"><script>(function(){try{var k="shadless-docs-theme";var apply=function(d){document.documentElement.classList.toggle("dark",!!d)};var s=localStorage.getItem(k);var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;apply(d);addEventListener("storage",function(e){if(e.key===k)apply(e.newValue==="dark")});}catch(e){}})();</script><link rel="stylesheet" href="../fonts.css"></head>
<body>
<div data-slot="native-select-wrapper" class="group/native-select"><select data-slot="native-select"><option>Choose a fruit</option><option>Apple</option><option>Banana</option><option>Blueberry</option></select><svg data-slot="native-select-icon"></svg></div>
<option data-slot="native-select-option">Option</option>
<optgroup data-slot="native-select-optgroup"></optgroup>
</body></html>
