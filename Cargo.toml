[package]
name = "pipeline"
version = "0.1.0"
edition = "2024"

# shadless-rs — Rust port of shadless/pipeline (the graph runner + converters).
# Byte-identity with the Go binary is the acceptance bar; see PLAN.md.

[dependencies]
sha2 = "0.10"
hex = "0.4"
regex = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
ureq = "2"
ryu = "1"
markup5ever_rcdom = "0.39.0"
html5ever = "0.39.0"
# Oxc experiment (PLAN.md「為什麼不是 Rolldown/Oxc」) — compiled only under
# `--features oxc`; the shipped binary and every graph key are identical
# without it. Subcrates must stay on ONE oxc release line: they are
# version-locked together (AST types move between minors).
oxc_allocator = { version = "0.149.0", optional = true }
oxc_ast = { version = "0.149.0", optional = true }
oxc_parser = { version = "0.149.0", optional = true }
oxc_span = { version = "0.149.0", optional = true }
oxc_syntax = { version = "0.149.0", optional = true }
oxc_transformer = { version = "0.149.0", optional = true }
oxc_codegen = { version = "0.149.0", optional = true }
oxc_semantic = { version = "0.149.0", optional = true }
# the bundler for the oracle api.Build point (no byte contract); pulls the
# oxc family in via rolldown_common
rolldown = { version = "1.2.8", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
oxc = ["dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_parser", "dep:oxc_span", "dep:oxc_syntax", "dep:oxc_transformer", "dep:oxc_codegen", "dep:oxc_semantic", "dep:rolldown", "dep:tokio"]

[build-dependencies]
sha2 = "0.10"
hex = "0.4"
walkdir = "2"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[lib]
name = "pipeline"
path = "src/lib.rs"

[profile.release]
debug = true
