<!doctype html>
<html><head><meta charset="utf-8"><title>shadless accordion</title></head>
<body>
  <div data-slot="accordion" id="ac" data-orientation="vertical">
    <div data-slot="accordion-item" data-state="closed" data-orientation="vertical">
      <button data-slot="accordion-trigger" id="d1-at1" type="button" aria-expanded="false" data-state="closed" data-orientation="vertical"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down pointer-events-none shrink-0 group-aria-expanded/accordion-trigger:hidden" data-slot="accordion-trigger-icon"><path d="m6 9 6 6 6-6"></path></svg>First</button>
      <div data-slot="accordion-content" id="d1-acc1" data-state="closed" hidden="" role="region" aria-labelledby="d1-at1" data-orientation="vertical">Body 1</div>
    </div>
    <div data-slot="accordion-item" data-state="closed" data-orientation="vertical">
      <button data-slot="accordion-trigger" id="d1-at2" type="button" aria-expanded="false" data-state="closed" data-orientation="vertical"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down pointer-events-none shrink-0 group-aria-expanded/accordion-trigger:hidden" data-slot="accordion-trigger-icon"><path d="m6 9 6 6 6-6"></path></svg>Second</button>
      <div data-slot="accordion-content" id="d1-acc2" data-state="closed" hidden="" role="region" aria-labelledby="d1-at2" data-orientation="vertical">Body 2</div>
    </div>
  </div>
  <script src="../../dist/shadless.js"></script>
  <script src="../../dist/js/accordion.js"></script>
  <script>shadless.initAll()</script>
</body></html>
