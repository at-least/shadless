<!doctype html>
<html><head><meta charset="utf-8"><title>shadless accordion (multiple)</title></head>
<body>
  <div data-slot="accordion" id="ac" data-orientation="vertical" data-type="multiple">
    <div data-slot="accordion-item" data-state="closed" data-orientation="vertical">
      <button data-slot="accordion-trigger" id="d1-at1" type="button" aria-expanded="false" data-state="closed" data-orientation="vertical">First</button>
      <div data-slot="accordion-content" id="d1-acc1" data-state="closed" hidden="" role="region" aria-labelledby="d1-at1" data-orientation="vertical">Body 1</div>
    </div>
    <div data-slot="accordion-item" data-state="closed" data-orientation="vertical">
      <button data-slot="accordion-trigger" id="d1-at2" type="button" aria-expanded="false" data-state="closed" data-orientation="vertical">Second</button>
      <div data-slot="accordion-content" id="d1-acc2" data-state="closed" hidden="" role="region" aria-labelledby="d1-at2" data-orientation="vertical">Body 2</div>
    </div>
  </div>
  <script src="/home/newlix/github/at-least/shadless/probes/t7/../../dist/shadless.js"></script>
  <script src="/home/newlix/github/at-least/shadless/probes/t7/../../dist/js/accordion.js"></script>
  <script>shadless.initAll()</script>
</body></html>
