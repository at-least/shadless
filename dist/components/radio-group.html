<!doctype html>
<html><head>
<link rel="stylesheet" href="../out.css"><meta charset="utf-8"><title>shadless radio-group</title><script>(function(){try{var k="shadless-docs-theme";var apply=function(d){document.documentElement.classList.toggle("dark",!!d)};var s=localStorage.getItem(k);var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;apply(d);addEventListener("storage",function(e){if(e.key===k)apply(e.newValue==="dark")});}catch(e){}})();</script></head>
<body>
  <div data-slot="radio-group" id="rg" role="radiogroup" aria-required="false" dir="ltr" tabindex="0">
    <button data-slot="radio-group-item" id="ri1" type="button" role="radio" aria-checked="false" data-state="unchecked" value="a" tabindex="-1"></button>
    <button data-slot="radio-group-item" id="ri2" type="button" role="radio" aria-checked="false" data-state="unchecked" value="b" tabindex="-1"></button>
  </div>
  <template data-for="radio-group-indicator">
    <span data-slot="radio-group-indicator" data-state="checked"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle></svg></span>
  </template>
  <script src="../shadless.js"></script>
  <script src="../js/radio-group.js"></script>
  <script>shadless.initAll()</script>
</body></html>
