<!doctype html>
<html><head><meta charset="utf-8"><title>shadless message-scroller</title>
<link rel="stylesheet" href="../out.css"><script>(function(){try{var k="shadless-docs-theme";var apply=function(d){document.documentElement.classList.toggle("dark",!!d)};var s=localStorage.getItem(k);var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;apply(d);addEventListener("storage",function(e){if(e.key===k)apply(e.newValue==="dark")});}catch(e){}})();</script></head>
<body>
<div></div>
<div data-slot="message-scroller" class="group/message-scroller"><div data-slot="message-scroller-viewport" style="height:160px;overflow:hidden;border:1px solid hsl(var(--border));border-radius:0.5rem;padding:0.75rem;background:hsl(var(--muted)/0.3)"><div data-slot="message-scroller-content"><div data-slot="message-scroller-item" style="margin-bottom:0.5rem">Top message</div><div data-slot="message-scroller-item" style="margin-bottom:0.5rem;margin-top:3rem">Middle message</div><div data-slot="message-scroller-item" style="margin-top:6rem">Bottom message</div></div></div></div>
<div data-slot="message-scroller-viewport"><div style="padding:0.75rem">Scrollable content</div></div>
<div data-slot="message-scroller-content"><div style="padding:0.75rem">Item content</div></div>
<div data-slot="message-scroller-item"><div style="padding:0.5rem;border:1px solid hsl(var(--border));border-radius:0.375rem">Item</div></div>
<button data-slot="message-scroller-button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:1rem;height:1rem"><path d="M12 5v14M5 12l7 7 7-7"></path></svg></button>
</body></html>
