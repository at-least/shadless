<!doctype html>
<html><head><meta charset="utf-8"><title>shadless input-group</title>
<link rel="stylesheet" href="../out.css"><script>(function(){try{var k="shadless-docs-theme";var apply=function(d){document.documentElement.classList.toggle("dark",!!d)};var s=localStorage.getItem(k);var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;apply(d);addEventListener("storage",function(e){if(e.key===k)apply(e.newValue==="dark")});}catch(e){}})();</script></head>
<body>
<div data-slot="input-group" class="group/input-group"><div data-slot="input-group-addon" style="display:flex;align-items:center;padding:0 0.75rem;border:1px solid var(--input);border-right:0;border-radius:0.375rem 0 0 0.375rem;background:var(--muted);color:var(--muted-foreground)">@</div><input data-slot="input-group-control" placeholder="Username" style="border-radius:0;border-left:0;border-right:0"><div data-slot="input-group-addon" style="display:flex;align-items:center;padding:0 0.75rem;border:1px solid var(--input);border-left:0;border-radius:0 0.375rem 0.375rem 0;background:var(--muted);color:var(--muted-foreground)">@example.com</div></div>
<div data-slot="input-group-addon">@</div>
<button class="input-group-button group/button">Button</button>
<span class="input-group-text">Text</span>
<input data-slot="input-group-control" placeholder="Type here…">
<textarea data-slot="input-group-control" placeholder="Type here…"></textarea>
</body></html>
