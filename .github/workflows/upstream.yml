# Nightly upstream drill. Detects a shadcn release newer than the pin, runs
# the full re-pin drill against it, and opens (or updates) ONE pull request
# carrying: the regenerated dist/ + docs/ (the review surface), the drill
# report, and task packets for whatever needs a person or an LLM.
#
# Green drill  → the PR is mergeable as-is: an upstream release absorbed with
#                zero manual work.
# Red drill    → the PR body says exactly what is UNEXPECTED (ours) versus
#                EXPECTED (upstream moved), and lists the task packets.
name: upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "shadcn@X.Y.Z (default: newest release)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Clone upstream with tags
        run: git clone --filter=blob:none https://github.com/shadcn-ui/ui .upstream/shadcn-ui
      - name: Resolve target tag
        id: target
        run: |
          CUR=$(node -p "require('./src/registry/pin.json').shadcn_ui.tag")
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}"; else
            TAG=$(git -C .upstream/shadcn-ui tag -l 'shadcn@*' | grep -E '^shadcn@[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1); fi
          echo "current=$CUR" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pin: $CUR  newest: $TAG"
          [ "$CUR" != "$TAG" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
      - if: steps.target.outputs.run == 'true'
        run: git -C .upstream/shadcn-ui checkout --quiet "${{ steps.target.outputs.current }}"
      - if: steps.target.outputs.run == 'true'
        run: npm ci && npx playwright install --with-deps chromium
      - name: Drill
        if: steps.target.outputs.run == 'true'
        id: drill
        continue-on-error: true
        run: node gates/upstream.mjs --to=${{ steps.target.outputs.tag }}
      - name: Refresh live-site golden snapshot
        if: steps.target.outputs.run == 'true'
        continue-on-error: true
        run: node tools/upstream-snapshot.mjs
      - name: Compose PR body
        if: steps.target.outputs.run == 'true'
        run: |
          { echo "Automated re-pin drill: \`${{ steps.target.outputs.current }}\` → \`${{ steps.target.outputs.tag }}\`"; echo;
            echo "Drill result: **${{ steps.drill.outcome == 'success' && 'GREEN — mergeable with zero manual work' || 'needs work — see report' }}**"; echo;
            cat build/gates/upstream-report.md 2>/dev/null || echo "(no report — the drill crashed before classification; see the job log)";
            if [ -d build/gates/tasks ]; then echo; echo "## Task packets"; for f in build/gates/tasks/*.md; do echo; echo "<details><summary>$(basename "$f")</summary>"; echo; cat "$f"; echo; echo "</details>"; done; fi
          } > /tmp/pr-body.md
      - uses: peter-evans/create-pull-request@v6
        if: steps.target.outputs.run == 'true'
        with:
          branch: upstream/${{ steps.target.outputs.tag }}
          title: "upstream: ${{ steps.target.outputs.tag }}"
          body-path: /tmp/pr-body.md
          commit-message: "upstream: re-pin to ${{ steps.target.outputs.tag }} (automated drill)"
          labels: upstream
          add-paths: |
            .
          delete-branch: true
